name: Deploy to GitHub Pages (Production)

# AI Model Dashboard - Optimized Pipeline
# Runs once daily at 6 AM UTC with manual trigger option
# Cost-optimized: ~20 minutes runtime, well within free tier limits

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:     # Manual trigger via GitHub UI
  
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "stable"
  DIOXUS_CLI_VERSION: "0.6.3"
  CARGO_AUDIT_VERSION: "0.21.2"
  PNPM_VERSION: "9"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Job 1: Security Audit
  # ═══════════════════════════════════════════════════════════════════════
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}

      - name: Run security audit
        run: cargo audit --deny warnings || echo "⚠️ Non-critical warnings found"

  # ═══════════════════════════════════════════════════════════════════════
  # Job 2: Code Quality & Testing
  # ═══════════════════════════════════════════════════════════════════════
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --lib

      - name: Verify all tests passed
        run: echo "✅ All tests passed successfully"

  # ═══════════════════════════════════════════════════════════════════════
  # Job 3: Data Update (AI Validation & JSON Generation)
  # ═══════════════════════════════════════════════════════════════════════
  data-update:
    name: Update Model Data
    runs-on: ubuntu-latest
    needs: [security-audit, test-and-lint]
    outputs:
      data_hash: ${{ steps.generate-data.outputs.data_hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp jsonschema toml pydantic

      - name: Run data scrapers
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python scripts/scrape_data.py --output ./frontend/public/data.json.new

      - name: Validate generated data
        run: |
          python scripts/validate_json.py ./frontend/public/data.json.new

      - name: Atomic file replacement
        run: |
          mv ./frontend/public/data.json.new ./frontend/public/data.json
          echo "✅ Data updated successfully"

      - name: Generate data hash
        id: generate-data
        run: |
          HASH=$(sha256sum ./frontend/public/data.json | cut -d' ' -f1)
          echo "data_hash=$HASH" >> $GITHUB_OUTPUT

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: frontend/public/data.json
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════
  # Job 4: Build Frontend
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: Build Production Assets
    runs-on: ubuntu-latest
    needs: [data-update]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-data
          path: frontend/public

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked --version ${{ env.DIOXUS_CLI_VERSION }}

      - name: Install Tailwind CSS
        run: |
          cd frontend
          pnpm add -D tailwindcss @tailwindcss/cli

      - name: Build Tailwind CSS
        run: |
          cd frontend
          npx tailwindcss -i ./assets/css/styles.css -o ./public/assets/css/main.css --minify

      - name: Apply production config
        run: |
          cd frontend
          cp Dioxus.production.toml Dioxus.toml

      - name: Build frontend
        env:
          BASE_PATH: /ai-model-dashboard
        run: |
          cd frontend
          dx build --release
          echo "✅ Frontend built successfully"

      - name: Setup GitHub Pages paths
        run: |
          sed -i 's|href="/assets/|href="/ai-model-dashboard/assets/|g' frontend/dist/public/index.html
          sed -i 's|src="/assets/|src="/ai-model-dashboard/assets/|g' frontend/dist/public/index.html
          touch frontend/dist/public/.nojekyll
          cp frontend/dist/public/index.html frontend/dist/public/404.html

      - name: Add security headers
        run: |
          cat > frontend/dist/public/_headers << 'EOF'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            X-XSS-Protection: 1; mode=block
            Referrer-Policy: strict-origin-when-cross-origin
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'
            Strict-Transport-Security: max-age=63072000; includeSubDomains; preload
          EOF

      - name: Add robots.txt
        run: |
          cat > frontend/dist/public/robots.txt << 'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://ionix-ray.github.io/ai-model-dashboard/sitemap.xml
          EOF

      - name: Generate build metadata
        run: |
          cat > frontend/dist/public/build-info.json << EOF
          {
            "version": "1.0.0",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "data_hash": "${{ needs.data-update.outputs.data_hash }}"
          }
          EOF

      - name: Verify build
        run: |
          ls -lah frontend/dist/public/
          test -f frontend/dist/public/index.html || exit 1
          test -f frontend/dist/public/data.json || exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: frontend/dist/public
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Job 5: Deploy to GitHub Pages
  # ═══════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Deployment successful!"
          echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "✅ All security checks passed"
          echo "✅ All tests passed"
          echo "✅ Data validated and updated"
